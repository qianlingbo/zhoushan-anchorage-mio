const DOCKS=[{"id":"wugang","name":"舟山武港","line":"L2","distance":"5NM","windows":[{"label":"初落(左靠)","ref":"high","occ":1,"offset":120,"pilot":80,"cond":""},{"label":"落末(左靠)","ref":"low","occ":2,"offset":60,"pilot":90,"cond":""},{"label":"初涨(右靠)","ref":"low","occ":1,"offset":120,"pilot":90,"cond":"10万吨级及以下"},{"label":"涨末(右靠)","ref":"high","occ":2,"offset":60,"pilot":80,"cond":"10万吨级及以下"}],"note":"10万吨级(不含)以上船舶不靠涨流"},{"id":"meidian","name":"舟山煤电(六横)","line":"L2","distance":"9NM","windows":[{"label":"初落(左靠)","ref":"high","occ":1,"offset":120,"pilot":105,"cond":""},{"label":"落末(左靠)","ref":"low","occ":2,"offset":60,"pilot":120,"cond":""},{"label":"初涨(右靠)","ref":"low","occ":1,"offset":120,"pilot":120,"cond":""},{"label":"涨末(右靠)","ref":"high","occ":2,"offset":60,"pilot":105,"cond":""}],"note":""},{"id":"zhongao","name":"海港中奥","line":"L2","distance":"10NM","windows":[{"label":"初落(左靠)","ref":"high","occ":1,"offset":120,"pilot":105,"cond":""},{"label":"落末(左靠)","ref":"low","occ":2,"offset":60,"pilot":120,"cond":""},{"label":"初涨(右靠)","ref":"low","occ":1,"offset":120,"pilot":120,"cond":"1号泊位"},{"label":"涨末(右靠)","ref":"high","occ":2,"offset":60,"pilot":105,"cond":"1号泊位"}],"note":""},{"id":"jinrun","name":"金润石油","line":"L2","distance":"17NM","windows":[{"label":"涨末(左靠)","ref":"high","occ":2,"offset":60,"pilot":150,"cond":""},{"label":"初涨(左靠)","ref":"low","occ":1,"offset":120,"pilot":150,"cond":"5万吨级以下"},{"label":"初落","ref":"high","occ":1,"offset":120,"pilot":150,"cond":"5万吨级以下"},{"label":"落末","ref":"low","occ":2,"offset":60,"pilot":150,"cond":"5万吨级以下"}],"note":"5万吨级(不含)以上不靠初涨和落水"},{"id":"huatai","name":"华泰石油","line":"L2/L1","distance":"13/12NM","windows":[{"label":"涨末(左靠)","ref":"high","occ":2,"offset":0,"pilot":120,"cond":""},{"label":"初涨(左靠)","ref":"low","occ":1,"offset":210,"pilot":135,"cond":"中小潮汛 10万吨级及以下"}],"note":"10万吨级(不含)以上不靠初涨; 冬季涨末提前0.5h"},{"id":"xingzhong","name":"兴中岙山","line":"L1","distance":"15NM","windows":[{"label":"初落(右靠)","ref":"high","occ":1,"offset":180,"pilot" const pad=n=>String(n).padStart(2,"0");
const dateKey=(m,d)=>pad(m)+"-"+pad(d);
const split=k=>{const [m,d]=k.split("-").map(Number);return{m,d}};
const daysInMonth=m=>new Date(YEAR,m,0).getDate();
const typeLabel=t=>t==="high"?"高潮":"低潮";
const timeToMinutes=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const smoothNumber=n=>Number(n.toFixed(2));
const buildTideCurvePath=pts=>pts.length?pts.slice(1).reduce((path,p,i)=>{const prev=pts[i];const span=p.x-prev.x;const handle=Math.max(span*.42,0);return path+" C "+smoothNumber(prev.x+handle)+" "+smoothNumber(prev.y)+" "+smoothNumber(p.x-handle)+" "+smoothNumber(p.y)+" "+smoothNumber(p.x)+" "+smoothNumber(p.y)},"M "+smoothNumber(pts[0].x)+" "+smoothNumber(pts[0].y)):"";
const minutesToClock=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const formatTime=total=>{const day=Math.floor(total/1440);const minutes=((total%1440)+1440)%1440;const prefix=day===0?"":day===1?"次日 ":day===-1?"前日 ":(day>0?"+":"")+day+"日 ";return{absolute:total,dayOffset:day,minutes,label:prefix+minutesToClock(minutes)}};
const formatOffset=m=>{const sign=m>=0?"后":"前";const value=Math.abs(m);const h=Math.floor(value/60);const mm=value%60;return sign+(h?h+"小时":"")+(mm?mm+"分钟":h?"":"0分钟")};
const formatDuration=m=>{const h=Math.floor(m/60);const mm=m%60;return (h?h+"小时":"")+(mm?mm+"分钟":"")||"0分钟"};
const todayKey=()=>{const now=new Date();const key=dateKey(now.getMonth()+1,now.getDate());return now.getFullYear()===YEAR&&TIDE_DATA[key]?key:"08-04"};
const addDay=(key,delta)=>{const {m,d}=split(key);const date=new Date(YEAR,m-1,d+delta);return date.getFullYear()===YEAR?dateKey(date.getMonth()+1,date.getDate()):key};
const buildWindows=(dock,tides)=>dock.windows.flatMap(rule=>tides.filter(t=>t.type===rule.ref).map((tide,index)=>{const berthAbs=timeToMinutes(tide.time)+rule.offset;return{id:rule.label+"-"+tide.time+"-"+index,rule,tide,berth:formatTime(berthAbs),report:formatTime(berthAbs-rule.pilot)}})).sort((a,b)=>a.berth.absolute-b.berth.absolute);
let selectedDate=todayKey();
let selectedDock="meidian";
let selectedTheme=readTheme();
function readTheme(){try{const theme=localStorage.getItem(THEME_STORAGE_KEY);if(theme==="light"||theme==="dark")return theme}catch{}return typeof matchMedia==="function"&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function renderThemeToggle(){const button=document.getElementById("theme-toggle");button.querySelectorAll("[data-theme-option]").forEach(option=>option.classList.toggle("active",option.dataset.themeOption===selectedTheme))}
function selectTheme(theme){selectedTheme=theme;document.documentElement.dataset.theme=theme;try{localStorage.setItem(THEME_STORAGE_KEY,theme)}catch{}renderThemeToggle()}
function currentNowMinutes(){const now=new Date();const key=dateKey(now.getMonth()+1,now.getDate());return now.getFullYear()===YEAR&&key===selectedDate?now.getHours()*60+now.getMinutes():null}
function renderControls(){const {m,d}=split(selectedDate);month.innerHTML=Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'月</option>').join("");month.value=m;day.innerHTML=Array.from({length:daysInMonth(m)},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'日</option>').join("");day.value=d}
function renderDocks(){docks.innerHTML=DOCKS.map(d=>'<button class="dock '+(d.id===selectedDock?'active':'')+'" data-id="'+d.id+'"><span>'+d.name+'</span><small>'+d.line+' · '+d.distance+'</small></button>').join("")}
function renderSide(dock){side.innerHTML='<div class="dock-title"><p class="eyebrow">当前码头</p><h2>'+dock.name+'</h2><span>'+dock.line+' 报告线 · '+dock.distance+'</span></div><div class="rules">'+dock.windows.map(r=>'<div class="rule"><strong>'+r.label+'</strong><span>'+typeLabel(r.ref)+formatOffset(r.offset)+' · 航行 '+formatDuration(r.pilot)+'</span>'+(r.cond?'<small>'+r.cond+'</small>':'')+'</div>').join("")+'</div>'+(dock.note?'<p class="notice">'+dock.note+'</p>':'')}
function renderTide(tides){const min=Math.min(...tides.map(t=>t.height));const max=Math.max(...tides.map(t=>t.height));const range=Math.max(max-min,1);const pts=tides.map(t=>({...t,x:timeToMinutes(t.time)/1440*100,y:78-(t.height-min)/range*46}));const path=buildTideCurvePath(pts);tide.innerHTML='<div class="heading"><div><p class="eyebrow">定海潮汐</p><h2>当天潮时与潮高</h2></div><div class="legend"><span><i class="dot high"></i>高潮</span><span><i class="dot low"></i>低潮</span></div></div><div class="curve"><svg viewBox="0 0 100 104" preserveAspectRatio="none"><line x1="0" y1="82" x2="100" y2="82" class="axis"></line><path d="'+path+'" class="path"></path>'+pts.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="1.35" class="point '+p.type+'"></circle>').join("")+'</svg><div class="marks">'+pts.map(p=>'<div class="mark" style="left:'+p.x+'%"><span class="pill '+p.type+'">'+typeLabel(p.type)+'</span><strong>'+p.time+'</strong><small>'+p.height+'cm</small></div>').join("")+'</div></div><div class="axis-time"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>'}
function renderWindows(windows,dock){const now=currentNowMinutes();const nextId=now===null?windows[0]?.id:(windows.find(w=>w.berth.absolute>=now)?.id||windows[0]?.id);const {m,d}=split(selectedDate);document.getElementById("windows").innerHTML='<div class="heading"><div><p class="eyebrow">'+YEAR+'年'+m+'月'+d+'日</p><h2>合适靠泊时间</h2></div><span class="count">'+windows.length+' 个窗口</span></div><div class="windows">'+windows.map(w=>'<article class="card '+(w.id===nextId?'next':'')+'"><div class="topline"><span class="label">'+w.rule.label+'</span>'+(w.id===nextId?'<span class="badge">下一窗口</span>':'')+'</div><div class="times"><div><span>靠泊</span><strong>'+w.berth.label+'</strong></div><div><span>到线</span><strong>'+w.report.label+'</strong></div></div><div class="meta"><span>'+typeLabel(w.tide.type)+' '+w.tide.time+' '+formatOffset(w.rule.offset)+'</span><span>航行 '+formatDuration(w.rule.pilot)+'</span>'+(w.rule.cond?'<span>'+w.rule.cond+'</span>':'')+'</div></article>').join("")+'</div>'}
function render(){renderControls();renderDocks();const dock=DOCKS.find(d=>d.id===selectedDock)||DOCKS[0];const tides=TIDE_DATA[selectedDate]||[];renderSide(dock);renderTide(tides);renderWindows(buildWindows(dock,tides),dock)}
month.addEventListener("change",e=>{const {d}=split(selectedDate);selectedDate=dateKey(Number(e.target.value),Math.min(d,daysInMonth(Number(e.target.value))));render()});
day.addEventListener("change",e=>{const {m}=split(selectedDate);selectedDate=dateKey(m,Number(e.target.value));render()});
prev.addEventListener("click",()=>{selectedDate=addDay(selectedDate,-1);render()});
next.addEventListener("click",()=>{selectedDate=addDay(selectedDate,1);render()});
today.addEventListener("click",()=>{selectedDate=todayKey();render()});
document.getElementById("theme-toggle").addEventListener("click",()=>selectTheme(selectedTheme==="dark"?"light":"dark"));
docks.addEventListener("click",e=>{const button=e.target.closest("button[data-id]");if(!button)return;selectedDock=button.dataset.id;render()});
document.getElementById("install-copy").addEventListener("click",async e=>{try{await navigator.clipboard.writeText(INSTALL_COMMAND);e.currentTarget.textContent="已复制";setTimeout(()=>{e.currentTarget.textContent="复制安装命令"},1800)}catch{e.currentTarget.textContent="复制失败";setTimeout(()=>{e.currentTarget.textContent="复制安装命令"},1800)}});
render();
renderThemeToggle();
</script>
