name: Update Data

on:
  schedule:
    # GitHub cron uses UTC. Asia/Shanghai main checks:
    # 08:10, 12:10, 17:10, 20:10, with one-hour retry slots:
    # 09:10, 13:10, 18:10, 21:10.
    - cron: "10 0,1,4,5,9,10,12,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anchorage-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Shanghai
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Update anchorage data
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_data.py --no-cache-on-failure --require-all; then
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              break
            fi

            echo "Data source unavailable, retrying in 5 minutes..."
            sleep 300
          done

          echo "Data source still unavailable; leaving the last successful data unchanged."
          exit 1

      - name: Commit and push data changes
        run: |
          if git diff --quiet -- data/latest.json data/data.js; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/data.js
          git commit -m "auto update data"
          git push
