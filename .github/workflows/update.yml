name: Update Data

on:
  schedule:
    # GitHub cron uses UTC. Asia/Shanghai main checks:
    # 07:15, 12:13, 17:13, 20:13.
    - cron: "15 23 * * *"
    - cron: "13 4,9,12 * * *"
    # One-hour retry slots in Asia/Shanghai:
    # 09:13, 13:13, 18:13, 21:13.
    - cron: "13 1,5,10,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anchorage-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Shanghai
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Update anchorage data (with skip-current-window)
        id: update
        run: |
          # Try primary fetch.  If this window already has data, the script
          # skips immediately (--skip-current-window), which is not a failure.
          if python scripts/update_data.py --skip-current-window --require-all; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Retry up to 2 times with 2 min gaps
          for attempt in 1 2; do
            if python scripts/update_data.py --skip-current-window --require-all; then
              echo "success=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" = "2" ]; then break; fi
            echo "Data source unavailable, retrying in 2 minutes (attempt ${attempt}/2)..."
            sleep 120
          done

          echo "All attempts failed; writing fallback marker."
          echo "success=false" >> "$GITHUB_OUTPUT"

      - name: Write fallback when source is unavailable
        if: steps.update.outputs.success == 'false'
        run: |
          # --cache-only writes a "数据源暂不可用" status but keeps the
          # last successful anchor data so the website still displays it.
          python scripts/update_data.py --cache-only

      - name: Commit and push data changes
        run: |
          if git diff --quiet -- data/latest.json data/data.js; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/data.js
          git commit -m "auto update data"
          git push

