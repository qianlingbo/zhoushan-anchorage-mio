name: Update Data

on:
  schedule:
    # GitHub cron uses UTC. Source data usually updates around
    # 06:00, 12:00, 16:00, and 20:00 Asia/Shanghai.
    # Check shortly after each expected publish time, then once more
    # 80 minutes later as a delay fallback.
    - cron: "10,30,50 22,4,8,12 * * *"
    - cron: "20 23,5,9,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anchorage-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Shanghai
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Update anchorage data
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_data.py --no-cache-on-failure; then
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              break
            fi

            echo "Data source unavailable, retrying in 5 minutes..."
            sleep 300
          done

          echo "Data source still unavailable; keeping cached data and recording this check."
          python scripts/update_data.py --cache-only --skip-current-window

      - name: Commit and push data changes
        run: |
          if git diff --quiet -- data/latest.json data/data.js; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/data.js
          git commit -m "auto update data"
          git push
